<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t">
  <title id="t">A phone number with country code turned into a QR code, which a phone camera scans to open a chat link</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#062a27"/>
      <stop offset="0.55" stop-color="#15564f"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="cam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f3745"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <clipPath id="screen"><rect x="844" y="74" width="252" height="482" rx="34"/></clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="600" cy="315" r="280" fill="#3fbfaa" fill-opacity="0.06"/>

  <!-- 1. number card -->
  <g filter="url(#shadow)">
    <rect x="60" y="200" width="300" height="230" rx="24" fill="#ffffff"/>
  </g>
  <g transform="translate(100 248)">
    <circle r="22" fill="#d5f5ee"/>
    <path d="M-9 -11 c-3 0 -5 3 -4 6 c2 9 9 16 18 18 c3 1 6 -1 6 -4 v-4 l-6 -3 l-3 3 c-4 -2 -7 -5 -9 -9 l3 -3 l-3 -6 z" fill="#148577"/>
  </g>
  <rect x="136" y="236" width="130" height="10" rx="5" fill="#0b1020" fill-opacity="0.75"/>
  <rect x="136" y="254" width="90" height="8" rx="4" fill="#5f718c" fill-opacity="0.45"/>
  <!-- country code + number fields -->
  <rect x="84" y="296" width="84" height="50" rx="12" fill="#f4f6f8" stroke="#ccd4df"/>
  <text x="126" y="328" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#0b1020">+1</text>
  <rect x="178" y="296" width="158" height="50" rx="12" fill="#ffffff" stroke="#148577" stroke-width="2"/>
  <text x="257" y="328" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#0b1020">5551234567</text>
  <rect x="84" y="366" width="252" height="40" rx="12" fill="#eefbf8" stroke="#aeebdd"/>
  <rect x="100" y="382" width="150" height="8" rx="4" fill="#148577" fill-opacity="0.5"/>

  <!-- arrow 1 -->
  <path d="M380 315 H440" stroke="#3fbfaa" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 13"/>
  <path d="M436 302 l14 13 l-14 13" fill="none" stroke="#3fbfaa" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 2. QR code -->
  <g filter="url(#shadow)">
    <rect x="470" y="185" width="260" height="260" rx="24" fill="#ffffff"/>
  </g>
  <g fill="#0b1020">
    <path d="M494 209h56v56h-56z M504 219v36h36v-36z" fill-rule="evenodd"/><rect x="512" y="227" width="20" height="20"/>
    <path d="M650 209h56v56h-56z M660 219v36h36v-36z" fill-rule="evenodd"/><rect x="668" y="227" width="20" height="20"/>
    <path d="M494 365h56v56h-56z M504 375v36h36v-36z" fill-rule="evenodd"/><rect x="512" y="383" width="20" height="20"/>
    <rect x="564" y="209" width="13" height="13"/><rect x="590" y="222" width="13" height="13"/><rect x="616" y="209" width="13" height="13"/>
    <rect x="576" y="244" width="13" height="13"/><rect x="604" y="252" width="13" height="13"/>
    <rect x="494" y="280" width="13" height="13"/><rect x="520" y="294" width="13" height="13"/><rect x="546" y="280" width="13" height="13"/>
    <rect x="572" y="306" width="13" height="13"/><rect x="598" y="280" width="13" height="13"/><rect x="624" y="298" width="13" height="13"/>
    <rect x="650" y="280" width="13" height="13"/><rect x="676" y="306" width="13" height="13"/><rect x="693" y="282" width="13" height="13"/>
    <rect x="508" y="320" width="13" height="13"/><rect x="598" y="324" width="13" height="13"/><rect x="662" y="330" width="13" height="13"/>
    <rect x="564" y="365" width="13" height="13"/><rect x="590" y="384" width="13" height="13"/><rect x="618" y="368" width="13" height="13"/>
    <rect x="644" y="388" width="13" height="13"/><rect x="672" y="370" width="13" height="13"/><rect x="564" y="408" width="13" height="13"/>
    <rect x="620" y="408" width="13" height="13"/><rect x="693" y="408" width="13" height="13"/>
  </g>
  <!-- chat badge on QR -->
  <g transform="translate(730 185)">
    <circle r="26" fill="#148577" stroke="#ffffff" stroke-width="5"/>
    <path d="M-12 -9 h24 a6 6 0 0 1 6 6 v10 a6 6 0 0 1 -6 6 h-10 l-9 8 v-8 h-5 a6 6 0 0 1 -6 -6 v-10 a6 6 0 0 1 6 -6 z" fill="#ffffff"/>
  </g>

  <!-- arrow 2 -->
  <path d="M752 315 H808" stroke="#3fbfaa" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 13"/>
  <path d="M804 302 l14 13 l-14 13" fill="none" stroke="#3fbfaa" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 3. phone scanning -->
  <g filter="url(#shadow)">
    <rect x="830" y="60" width="280" height="510" rx="44" fill="#0b1020"/>
  </g>
  <g clip-path="url(#screen)">
    <rect x="844" y="74" width="252" height="482" fill="url(#cam)"/>
    <g stroke="#3fbfaa" stroke-width="6" fill="none" stroke-linecap="round">
      <path d="M874 262 v-28 h28"/><path d="M1038 234 h28 v28"/>
      <path d="M874 398 v28 h28"/><path d="M1038 426 h28 v-28"/>
    </g>
    <g fill="#ffffff" fill-opacity="0.5">
      <path d="M896 256h34v34h-34z M902 262v22h22v-22z" fill-rule="evenodd"/>
      <path d="M1010 256h34v34h-34z M1016 262v22h22v-22z" fill-rule="evenodd"/>
      <path d="M896 370h34v34h-34z M902 376v22h22v-22z" fill-rule="evenodd"/>
      <rect x="944" y="258" width="10" height="10"/><rect x="964" y="272" width="10" height="10"/><rect x="984" y="258" width="10" height="10"/>
      <rect x="898" y="306" width="10" height="10"/><rect x="922" y="320" width="10" height="10"/><rect x="946" y="306" width="10" height="10"/>
      <rect x="970" y="328" width="10" height="10"/><rect x="994" y="308" width="10" height="10"/><rect x="1018" y="326" width="10" height="10"/>
      <rect x="946" y="372" width="10" height="10"/><rect x="970" y="390" width="10" height="10"/><rect x="996" y="376" width="10" height="10"/>
      <rect x="1020" y="394" width="10" height="10"/><rect x="950" y="396" width="10" height="10"/>
    </g>
    <!-- detected link banner -->
    <rect x="860" y="112" width="220" height="92" rx="18" fill="#ffffff"/>
    <text x="878" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" fill="#0b1020">wa.me/15551234567</text>
    <rect x="878" y="160" width="100" height="30" rx="10" fill="#148577"/>
    <text x="928" y="180" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Open chat</text>
    <circle cx="970" cy="530" r="24" fill="none" stroke="#ffffff" stroke-width="4"/>
    <circle cx="970" cy="530" r="17" fill="#ffffff"/>
  </g>
  <rect x="925" y="76" width="90" height="20" rx="10" fill="#0b1020"/>
</svg>
