<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t">
  <title id="t">A table card with a QR code that says scan to review, next to a phone showing a five-star review screen</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#062a27"/>
      <stop offset="0.55" stop-color="#15564f"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <clipPath id="screen"><rect x="704" y="74" width="252" height="482" rx="34"/></clipPath>
    <symbol id="star" viewBox="-12 -12 24 24">
      <path d="M0 -11 L3.2 -3.6 L11 -3.4 L4.8 1.6 L7 9.4 L0 4.8 L-7 9.4 L-4.8 1.6 L-11 -3.4 L-3.2 -3.6 Z"/>
    </symbol>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="600" cy="330" r="290" fill="#3fbfaa" fill-opacity="0.06"/>

  <!-- table tent card -->
  <path d="M200 560 L260 130 L520 130 L580 560 Z" fill="#000000" fill-opacity="0.18"/>
  <g filter="url(#shadow)">
    <rect x="240" y="110" width="300" height="420" rx="24" fill="#ffffff"/>
  </g>
  <!-- stars on card -->
  <g fill="#f5b301">
    <use href="#star" x="288" y="138" width="28" height="28"/>
    <use href="#star" x="324" y="138" width="28" height="28"/>
    <use href="#star" x="360" y="138" width="28" height="28"/>
    <use href="#star" x="396" y="138" width="28" height="28"/>
    <use href="#star" x="432" y="138" width="28" height="28"/>
  </g>
  <rect x="280" y="188" width="220" height="220" rx="14" fill="#ffffff" stroke="#e4e8ee"/>
  <g fill="#0b1020">
    <path d="M296 204h52v52h-52z M305 213v34h34v-34z" fill-rule="evenodd"/><rect x="313" y="221" width="18" height="18"/>
    <path d="M432 204h52v52h-52z M441 213v34h34v-34z" fill-rule="evenodd"/><rect x="449" y="221" width="18" height="18"/>
    <path d="M296 340h52v52h-52z M305 349v34h34v-34z" fill-rule="evenodd"/><rect x="313" y="357" width="18" height="18"/>
    <rect x="360" y="204" width="12" height="12"/><rect x="384" y="216" width="12" height="12"/><rect x="406" y="204" width="12" height="12"/>
    <rect x="372" y="238" width="12" height="12"/><rect x="396" y="244" width="12" height="12"/>
    <rect x="296" y="270" width="12" height="12"/><rect x="320" y="282" width="12" height="12"/><rect x="344" y="270" width="12" height="12"/>
    <rect x="368" y="292" width="12" height="12"/><rect x="392" y="270" width="12" height="12"/><rect x="416" y="286" width="12" height="12"/>
    <rect x="440" y="270" width="12" height="12"/><rect x="464" y="292" width="12" height="12"/><rect x="472" y="272" width="12" height="12"/>
    <rect x="310" y="306" width="12" height="12"/><rect x="390" y="310" width="12" height="12"/><rect x="450" y="314" width="12" height="12"/>
    <rect x="360" y="340" width="12" height="12"/><rect x="384" y="358" width="12" height="12"/><rect x="410" y="342" width="12" height="12"/>
    <rect x="434" y="360" width="12" height="12"/><rect x="460" y="344" width="12" height="12"/><rect x="360" y="380" width="12" height="12"/>
    <rect x="414" y="380" width="12" height="12"/><rect x="472" y="380" width="12" height="12"/>
  </g>
  <text x="390" y="452" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="24" font-weight="800" fill="#0b1020">Scan to review</text>
  <text x="390" y="482" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" fill="#4a5a73">Share your experience</text>

  <!-- arrow -->
  <path d="M565 320 C 610 290, 640 290, 675 315" fill="none" stroke="#3fbfaa" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 14"/>
  <path d="M664 300 l14 17 l-21 6" fill="none" stroke="#3fbfaa" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- phone with review screen -->
  <g filter="url(#shadow)"><rect x="690" y="60" width="280" height="510" rx="44" fill="#0b1020"/></g>
  <g clip-path="url(#screen)">
    <rect x="704" y="74" width="252" height="482" fill="#ffffff"/>
    <!-- business header -->
    <rect x="704" y="74" width="252" height="120" fill="#eefbf8"/>
    <circle cx="830" cy="138" r="30" fill="#148577"/>
    <path d="M814 150 v-14 l16 -12 l16 12 v14 z" fill="#ffffff"/>
    <rect x="824" y="140" width="12" height="10" fill="#148577"/>
    <rect x="760" y="208" width="140" height="12" rx="6" fill="#0b1020" fill-opacity="0.85"/>
    <rect x="785" y="228" width="90" height="8" rx="4" fill="#5f718c" fill-opacity="0.5"/>
    <!-- rate stars -->
    <g fill="#f5b301">
      <use href="#star" x="724" y="256" width="40" height="40"/>
      <use href="#star" x="768" y="256" width="40" height="40"/>
      <use href="#star" x="812" y="256" width="40" height="40"/>
      <use href="#star" x="856" y="256" width="40" height="40"/>
      <use href="#star" x="900" y="256" width="40" height="40"/>
    </g>
    <!-- review text box -->
    <rect x="722" y="316" width="216" height="120" rx="14" fill="#f4f6f8" stroke="#ccd4df"/>
    <rect x="738" y="334" width="170" height="9" rx="4.5" fill="#4a5a73" fill-opacity="0.45"/>
    <rect x="738" y="352" width="150" height="9" rx="4.5" fill="#4a5a73" fill-opacity="0.35"/>
    <rect x="738" y="370" width="120" height="9" rx="4.5" fill="#4a5a73" fill-opacity="0.3"/>
    <rect x="738" y="404" width="2" height="18" fill="#148577"/>
    <!-- post button -->
    <rect x="722" y="458" width="216" height="50" rx="14" fill="#148577"/>
    <text x="830" y="490" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Post review</text>
  </g>
  <rect x="785" y="76" width="90" height="20" rx="10" fill="#0b1020"/>

  <!-- floating rating chip -->
  <g transform="translate(990 200)">
    <rect width="170" height="70" rx="18" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="24" y="46" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="28" font-weight="800" fill="#ffffff">4.9</text>
    <g fill="#f5b301">
      <use href="#star" x="78" y="26" width="16" height="16"/>
      <use href="#star" x="96" y="26" width="16" height="16"/>
      <use href="#star" x="114" y="26" width="16" height="16"/>
      <use href="#star" x="132" y="26" width="16" height="16"/>
    </g>
  </g>
</svg>
