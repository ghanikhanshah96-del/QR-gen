<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t">
  <title id="t">A browser window showing a free QR code generator with QR type options, a link field, a QR code preview, and PNG, SVG, and JPG download buttons</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#062a27"/>
      <stop offset="0.55" stop-color="#15564f"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="600" cy="320" r="300" fill="#3fbfaa" fill-opacity="0.06"/>

  <!-- browser window -->
  <g filter="url(#shadow)">
    <rect x="150" y="70" width="900" height="500" rx="22" fill="#ffffff"/>
  </g>
  <path d="M150 92 a22 22 0 0 1 22 -22 h856 a22 22 0 0 1 22 22 v30 h-900 z" fill="#e4e8ee"/>
  <circle cx="182" cy="96" r="7" fill="#f87171"/><circle cx="204" cy="96" r="7" fill="#fbbf24"/><circle cx="226" cy="96" r="7" fill="#34d399"/>
  <rect x="300" y="84" width="600" height="24" rx="12" fill="#ffffff"/>
  <rect x="316" y="93" width="10" height="8" rx="2" fill="#148577"/>
  <path d="M318 93 v-3 a3 3 0 0 1 6 0 v3" fill="none" stroke="#148577" stroke-width="2"/>
  <rect x="334" y="92" width="170" height="8" rx="4" fill="#5f718c" fill-opacity="0.45"/>

  <!-- left column: form -->
  <rect x="186" y="150" width="70" height="10" rx="5" fill="#0b1020" fill-opacity="0.8"/>
  <!-- type chips -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="600">
    <rect x="186" y="178" width="72" height="36" rx="10" fill="#148577"/>
    <text x="222" y="201" text-anchor="middle" fill="#ffffff">URL</text>
    <rect x="268" y="178" width="72" height="36" rx="10" fill="#ffffff" stroke="#ccd4df"/>
    <text x="304" y="201" text-anchor="middle" fill="#4a5a73">Text</text>
    <rect x="350" y="178" width="72" height="36" rx="10" fill="#ffffff" stroke="#ccd4df"/>
    <text x="386" y="201" text-anchor="middle" fill="#4a5a73">WiFi</text>
    <rect x="432" y="178" width="80" height="36" rx="10" fill="#ffffff" stroke="#ccd4df"/>
    <text x="472" y="201" text-anchor="middle" fill="#4a5a73">vCard</text>
    <rect x="522" y="178" width="78" height="36" rx="10" fill="#ffffff" stroke="#ccd4df"/>
    <text x="561" y="201" text-anchor="middle" fill="#4a5a73">Email</text>
  </g>
  <!-- URL field -->
  <rect x="186" y="244" width="110" height="10" rx="5" fill="#0b1020" fill-opacity="0.7"/>
  <rect x="186" y="264" width="414" height="50" rx="12" fill="#ffffff" stroke="#148577" stroke-width="2"/>
  <text x="206" y="296" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#0b1020">https://example.com</text>
  <rect x="402" y="278" width="2" height="22" fill="#148577"/>
  <!-- design row -->
  <rect x="186" y="342" width="90" height="10" rx="5" fill="#0b1020" fill-opacity="0.7"/>
  <g>
    <rect x="186" y="364" width="46" height="46" rx="12" fill="#0b1020"/>
    <rect x="242" y="364" width="46" height="46" rx="12" fill="#148577"/>
    <rect x="298" y="364" width="46" height="46" rx="12" fill="#1fa392"/>
    <rect x="354" y="364" width="46" height="46" rx="12" fill="#ffffff" stroke="#ccd4df"/>
    <path d="M369 393 l8 -12 l8 12 z" fill="#5f718c" fill-opacity="0.6"/>
    <rect x="410" y="364" width="190" height="46" rx="12" fill="#f4f6f8" stroke="#e4e8ee"/>
    <rect x="426" y="384" width="120" height="6" rx="3" fill="#ccd4df"/>
    <rect x="426" y="384" width="70" height="6" rx="3" fill="#148577"/>
    <circle cx="496" cy="387" r="9" fill="#ffffff" stroke="#148577" stroke-width="3"/>
  </g>
  <rect x="186" y="440" width="414" height="10" rx="5" fill="#5f718c" fill-opacity="0.25"/>
  <rect x="186" y="462" width="300" height="10" rx="5" fill="#5f718c" fill-opacity="0.2"/>

  <!-- right column: preview -->
  <rect x="650" y="150" width="364" height="384" rx="18" fill="#f4f6f8" stroke="#e4e8ee"/>
  <rect x="740" y="176" width="184" height="184" rx="12" fill="#ffffff"/>
  <g fill="#0b1020">
    <path d="M754 190h42v42h-42z M762 198v26h26v-26z" fill-rule="evenodd"/><rect x="768" y="204" width="14" height="14"/>
    <path d="M868 190h42v42h-42z M876 198v26h26v-26z" fill-rule="evenodd"/><rect x="882" y="204" width="14" height="14"/>
    <path d="M754 304h42v42h-42z M762 312v26h26v-26z" fill-rule="evenodd"/><rect x="768" y="318" width="14" height="14"/>
    <rect x="806" y="190" width="10" height="10"/><rect x="826" y="200" width="10" height="10"/><rect x="846" y="190" width="10" height="10"/>
    <rect x="814" y="218" width="10" height="10"/><rect x="836" y="226" width="10" height="10"/>
    <rect x="754" y="246" width="10" height="10"/><rect x="774" y="258" width="10" height="10"/><rect x="794" y="246" width="10" height="10"/>
    <rect x="814" y="266" width="10" height="10"/><rect x="834" y="248" width="10" height="10"/><rect x="854" y="262" width="10" height="10"/>
    <rect x="876" y="246" width="10" height="10"/><rect x="896" y="266" width="10" height="10"/><rect x="900" y="248" width="10" height="10"/>
    <rect x="766" y="280" width="10" height="10"/><rect x="834" y="282" width="10" height="10"/><rect x="884" y="286" width="10" height="10"/>
    <rect x="806" y="304" width="10" height="10"/><rect x="826" y="320" width="10" height="10"/><rect x="848" y="306" width="10" height="10"/>
    <rect x="870" y="322" width="10" height="10"/><rect x="892" y="308" width="10" height="10"/><rect x="806" y="336" width="10" height="10"/>
    <rect x="850" y="338" width="10" height="10"/><rect x="900" y="338" width="10" height="10"/>
  </g>
  <!-- ready check -->
  <circle cx="924" cy="176" r="18" fill="#148577"/>
  <path d="M915 176 l6 6 l12 -12" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="762" y="380" width="140" height="9" rx="4.5" fill="#148577" fill-opacity="0.55"/>
  <!-- download buttons -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="700" text-anchor="middle">
    <rect x="672" y="410" width="100" height="46" rx="12" fill="#148577"/>
    <text x="722" y="439" fill="#ffffff">PNG</text>
    <rect x="782" y="410" width="100" height="46" rx="12" fill="#ffffff" stroke="#ccd4df"/>
    <text x="832" y="439" fill="#0b1020">SVG</text>
    <rect x="892" y="410" width="100" height="46" rx="12" fill="#ffffff" stroke="#ccd4df"/>
    <text x="942" y="439" fill="#0b1020">JPG</text>
  </g>
  <g transform="translate(722 488)" fill="none" stroke="#5f718c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.6">
    <path d="M0 -12 v16"/><path d="M-7 -3 l7 7 l7 -7"/><path d="M-10 10 h20"/>
  </g>
  <rect x="742" y="492" width="200" height="8" rx="4" fill="#5f718c" fill-opacity="0.25"/>

  <!-- floating "free / no sign-up" badge -->
  <g transform="translate(980 40)">
    <rect x="0" y="0" width="170" height="56" rx="28" fill="#3fbfaa"/>
    <text x="85" y="35" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="800" fill="#062a27">FREE · No sign-up</text>
  </g>
</svg>
