<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t">
  <title id="t">A PDF document turned into a QR code, with a phone opening the same PDF after scanning it</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a0b14"/>
      <stop offset="0.55" stop-color="#5a1a2a"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <clipPath id="screen"><rect x="874" y="74" width="252" height="482" rx="34"/></clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="600" cy="330" r="290" fill="#ff6b6b" fill-opacity="0.06"/>

  <!-- PDF document -->
  <g filter="url(#shadow)">
    <path d="M70 110 H260 L320 170 V520 H70 Z" fill="#ffffff"/>
  </g>
  <path d="M260 110 V170 H320 Z" fill="#dfe3e9"/>
  <rect x="94" y="190" width="120" height="48" rx="10" fill="#d93025"/>
  <text x="154" y="224" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="26" font-weight="800" fill="#ffffff">PDF</text>
  <rect x="94" y="268" width="200" height="12" rx="6" fill="#0b1020" fill-opacity="0.8"/>
  <rect x="94" y="300" width="190" height="9" rx="4.5" fill="#4a5a73" fill-opacity="0.45"/>
  <rect x="94" y="322" width="170" height="9" rx="4.5" fill="#4a5a73" fill-opacity="0.4"/>
  <rect x="94" y="344" width="185" height="9" rx="4.5" fill="#4a5a73" fill-opacity="0.35"/>
  <rect x="94" y="378" width="200" height="90" rx="10" fill="#4a5a73" fill-opacity="0.12"/>
  <rect x="94" y="488" width="140" height="9" rx="4.5" fill="#4a5a73" fill-opacity="0.3"/>

  <!-- arrow to QR -->
  <path d="M345 315 C 370 295, 395 295, 420 312" fill="none" stroke="#ff8a7a" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 14"/>
  <path d="M409 298 l14 17 l-21 6" fill="none" stroke="#ff8a7a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- QR card -->
  <g filter="url(#shadow)">
    <rect x="450" y="185" width="260" height="260" rx="24" fill="#ffffff"/>
  </g>
  <g fill="#0b1020" transform="translate(190 30)">
    <path d="M296 204h52v52h-52z M305 213v34h34v-34z" fill-rule="evenodd"/><rect x="313" y="221" width="18" height="18"/>
    <path d="M432 204h52v52h-52z M441 213v34h34v-34z" fill-rule="evenodd"/><rect x="449" y="221" width="18" height="18"/>
    <path d="M296 340h52v52h-52z M305 349v34h34v-34z" fill-rule="evenodd"/><rect x="313" y="357" width="18" height="18"/>
    <rect x="360" y="204" width="12" height="12"/><rect x="384" y="216" width="12" height="12"/><rect x="406" y="204" width="12" height="12"/>
    <rect x="372" y="238" width="12" height="12"/><rect x="396" y="244" width="12" height="12"/>
    <rect x="296" y="270" width="12" height="12"/><rect x="320" y="282" width="12" height="12"/><rect x="344" y="270" width="12" height="12"/>
    <rect x="368" y="292" width="12" height="12"/><rect x="392" y="270" width="12" height="12"/><rect x="416" y="286" width="12" height="12"/>
    <rect x="440" y="270" width="12" height="12"/><rect x="464" y="292" width="12" height="12"/><rect x="472" y="272" width="12" height="12"/>
    <rect x="310" y="306" width="12" height="12"/><rect x="390" y="310" width="12" height="12"/><rect x="450" y="314" width="12" height="12"/>
    <rect x="360" y="340" width="12" height="12"/><rect x="384" y="358" width="12" height="12"/><rect x="410" y="342" width="12" height="12"/>
    <rect x="434" y="360" width="12" height="12"/><rect x="460" y="344" width="12" height="12"/><rect x="360" y="380" width="12" height="12"/>
    <rect x="414" y="380" width="12" height="12"/><rect x="472" y="380" width="12" height="12"/>
  </g>
  <text x="580" y="490" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" font-weight="800" fill="#ffffff">Scan to open the PDF</text>

  <!-- arrow to phone -->
  <path d="M735 315 C 765 295, 800 295, 832 312" fill="none" stroke="#ff8a7a" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 14"/>
  <path d="M821 298 l14 17 l-21 6" fill="none" stroke="#ff8a7a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- phone showing the PDF -->
  <g filter="url(#shadow)"><rect x="860" y="60" width="280" height="510" rx="44" fill="#0b1020"/></g>
  <g clip-path="url(#screen)">
    <rect x="874" y="74" width="252" height="482" fill="#eef1f5"/>
    <rect x="874" y="74" width="252" height="70" fill="#ffffff"/>
    <rect x="892" y="112" width="44" height="22" rx="5" fill="#d93025"/>
    <text x="914" y="128" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="800" fill="#ffffff">PDF</text>
    <rect x="946" y="118" width="110" height="10" rx="5" fill="#0b1020" fill-opacity="0.75"/>
    <rect x="898" y="162" width="204" height="270" rx="6" fill="#ffffff"/>
    <rect x="916" y="184" width="150" height="11" rx="5.5" fill="#0b1020" fill-opacity="0.8"/>
    <rect x="916" y="210" width="168" height="8" rx="4" fill="#4a5a73" fill-opacity="0.45"/>
    <rect x="916" y="228" width="150" height="8" rx="4" fill="#4a5a73" fill-opacity="0.4"/>
    <rect x="916" y="246" width="160" height="8" rx="4" fill="#4a5a73" fill-opacity="0.35"/>
    <rect x="916" y="272" width="168" height="80" rx="8" fill="#4a5a73" fill-opacity="0.12"/>
    <rect x="916" y="370" width="140" height="8" rx="4" fill="#4a5a73" fill-opacity="0.35"/>
    <rect x="916" y="388" width="120" height="8" rx="4" fill="#4a5a73" fill-opacity="0.3"/>
    <rect x="892" y="458" width="216" height="50" rx="14" fill="#d93025"/>
    <text x="1000" y="490" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Download PDF</text>
  </g>
  <rect x="955" y="76" width="90" height="20" rx="10" fill="#0b1020"/>
</svg>
