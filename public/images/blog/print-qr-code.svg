<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t">
  <title id="t">A printer producing a sheet with a QR code marked 2.5 cm wide, next to a phone confirming the printed code scans correctly</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a3a"/>
      <stop offset="0.55" stop-color="#1d3f7a"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="printer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2f8"/>
      <stop offset="1" stop-color="#c3cddb"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <clipPath id="screen"><rect x="774" y="74" width="252" height="482" rx="34"/></clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="600" cy="330" r="290" fill="#6b9cff" fill-opacity="0.07"/>

  <!-- printed sheet -->
  <g filter="url(#shadow)">
    <rect x="220" y="60" width="340" height="360" rx="6" fill="#ffffff"/>
  </g>
  <g fill="#0b1020" transform="translate(-4 -108)">
    <path d="M296 204h52v52h-52z M305 213v34h34v-34z" fill-rule="evenodd"/><rect x="313" y="221" width="18" height="18"/>
    <path d="M432 204h52v52h-52z M441 213v34h34v-34z" fill-rule="evenodd"/><rect x="449" y="221" width="18" height="18"/>
    <path d="M296 340h52v52h-52z M305 349v34h34v-34z" fill-rule="evenodd"/><rect x="313" y="357" width="18" height="18"/>
    <rect x="360" y="204" width="12" height="12"/><rect x="384" y="216" width="12" height="12"/><rect x="406" y="204" width="12" height="12"/>
    <rect x="372" y="238" width="12" height="12"/><rect x="396" y="244" width="12" height="12"/>
    <rect x="296" y="270" width="12" height="12"/><rect x="320" y="282" width="12" height="12"/><rect x="344" y="270" width="12" height="12"/>
    <rect x="368" y="292" width="12" height="12"/><rect x="392" y="270" width="12" height="12"/><rect x="416" y="286" width="12" height="12"/>
    <rect x="440" y="270" width="12" height="12"/><rect x="464" y="292" width="12" height="12"/><rect x="472" y="272" width="12" height="12"/>
    <rect x="310" y="306" width="12" height="12"/><rect x="390" y="310" width="12" height="12"/><rect x="450" y="314" width="12" height="12"/>
    <rect x="360" y="340" width="12" height="12"/><rect x="384" y="358" width="12" height="12"/><rect x="410" y="342" width="12" height="12"/>
    <rect x="434" y="360" width="12" height="12"/><rect x="460" y="344" width="12" height="12"/><rect x="360" y="380" width="12" height="12"/>
    <rect x="414" y="380" width="12" height="12"/><rect x="472" y="380" width="12" height="12"/>
  </g>
  <!-- size marker -->
  <g fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round">
    <path d="M292 304 H480"/>
    <path d="M292 296 V312"/>
    <path d="M480 296 V312"/>
  </g>
  <text x="386" y="342" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="24" font-weight="800" fill="#2563eb">2.5 cm</text>

  <!-- printer -->
  <g filter="url(#shadow)">
    <rect x="130" y="372" width="520" height="170" rx="26" fill="url(#printer)"/>
  </g>
  <rect x="200" y="372" width="380" height="16" rx="8" fill="#0b1020" fill-opacity="0.8"/>
  <rect x="220" y="360" width="340" height="20" fill="#ffffff"/>
  <rect x="200" y="378" width="380" height="10" rx="5" fill="#0b1020" fill-opacity="0.85"/>
  <rect x="190" y="440" width="300" height="48" rx="10" fill="#0b1020" fill-opacity="0.1"/>
  <rect x="210" y="458" width="150" height="12" rx="6" fill="#4a5a73" fill-opacity="0.5"/>
  <circle cx="540" cy="450" r="17" fill="#2563eb"/>
  <circle cx="590" cy="450" r="11" fill="#4a5a73" fill-opacity="0.35"/>
  <rect x="190" y="508" width="400" height="10" rx="5" fill="#4a5a73" fill-opacity="0.22"/>

  <!-- arrow -->
  <path d="M600 230 C 640 200, 690 200, 730 225" fill="none" stroke="#6b9cff" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 14"/>
  <path d="M719 210 l14 17 l-21 6" fill="none" stroke="#6b9cff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- phone confirming the scan -->
  <g filter="url(#shadow)"><rect x="760" y="60" width="280" height="510" rx="44" fill="#0b1020"/></g>
  <g clip-path="url(#screen)">
    <rect x="774" y="74" width="252" height="482" fill="#ffffff"/>
    <rect x="774" y="74" width="252" height="130" fill="#eef4ff"/>
    <circle cx="900" cy="270" r="62" fill="#148577"/>
    <path d="M870 270 l22 24 l40 -46" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="900" y="376" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="25" font-weight="800" fill="#0b1020">Scan works</text>
    <text x="900" y="406" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" fill="#4a5a73">Ready to print more</text>
    <rect x="792" y="458" width="216" height="50" rx="14" fill="#2563eb"/>
    <text x="900" y="490" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Print all copies</text>
  </g>
  <rect x="855" y="76" width="90" height="20" rx="10" fill="#0b1020"/>
</svg>
