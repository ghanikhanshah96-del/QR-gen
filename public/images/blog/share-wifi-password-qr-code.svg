<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t">
  <title id="t">One phone showing a WiFi QR code while a second phone scans it and connects to the network</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#062a27"/>
      <stop offset="0.55" stop-color="#15564f"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#3fbfaa"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="600" cy="315" r="280" fill="#3fbfaa" fill-opacity="0.06"/>

  <!-- LEFT PHONE: sharing screen with QR -->
  <g filter="url(#shadow)">
    <rect x="200" y="60" width="290" height="510" rx="44" fill="#0b1020"/>
  </g>
  <rect x="214" y="74" width="262" height="482" rx="34" fill="#f4f6f8"/>
  <rect x="300" y="86" width="90" height="20" rx="10" fill="#0b1020"/>
  <!-- header: wifi icon + text lines -->
  <circle cx="252" cy="146" r="20" fill="#d5f5ee"/>
  <g transform="translate(252 150)" fill="none" stroke="#148577" stroke-width="4" stroke-linecap="round">
    <path d="M-11 -4 A15 15 0 0 1 11 -4"/><path d="M-6 1 A8 8 0 0 1 6 1"/>
    <circle cx="0" cy="6" r="2" fill="#148577" stroke="none"/>
  </g>
  <rect x="282" y="134" width="130" height="11" rx="5.5" fill="#0b1020" fill-opacity="0.8"/>
  <rect x="282" y="152" width="90" height="9" rx="4.5" fill="#5f718c" fill-opacity="0.5"/>
  <!-- QR on left phone -->
  <rect x="238" y="186" width="214" height="214" rx="16" fill="#ffffff" stroke="#e4e8ee"/>
  <g fill="#0b1020">
    <path d="M256 204h50v50h-50z M265 213v32h32v-32z" fill-rule="evenodd"/><rect x="272" y="220" width="18" height="18"/>
    <path d="M384 204h50v50h-50z M393 213v32h32v-32z" fill-rule="evenodd"/><rect x="400" y="220" width="18" height="18"/>
    <path d="M256 332h50v50h-50z M265 341v32h32v-32z" fill-rule="evenodd"/><rect x="272" y="348" width="18" height="18"/>
    <rect x="318" y="204" width="11" height="11"/><rect x="340" y="214" width="11" height="11"/><rect x="362" y="204" width="11" height="11"/>
    <rect x="328" y="236" width="11" height="11"/><rect x="352" y="244" width="11" height="11"/>
    <rect x="256" y="268" width="11" height="11"/><rect x="278" y="280" width="11" height="11"/><rect x="300" y="268" width="11" height="11"/>
    <rect x="322" y="290" width="11" height="11"/><rect x="344" y="268" width="11" height="11"/><rect x="366" y="282" width="11" height="11"/>
    <rect x="390" y="268" width="11" height="11"/><rect x="412" y="290" width="11" height="11"/><rect x="423" y="268" width="11" height="11"/>
    <rect x="270" y="304" width="11" height="11"/><rect x="342" y="306" width="11" height="11"/><rect x="398" y="310" width="11" height="11"/>
    <rect x="318" y="332" width="11" height="11"/><rect x="340" y="350" width="11" height="11"/><rect x="364" y="334" width="11" height="11"/>
    <rect x="390" y="352" width="11" height="11"/><rect x="414" y="336" width="11" height="11"/><rect x="320" y="370" width="11" height="11"/>
    <rect x="366" y="372" width="11" height="11"/><rect x="420" y="372" width="11" height="11"/>
  </g>
  <!-- "Share" button -->
  <rect x="238" y="424" width="214" height="48" rx="14" fill="#148577"/>
  <g transform="translate(300 448)" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 6 v6 h18 v-6"/><path d="M9 9 v-18"/><path d="M3 -3 l6 -6 l6 6"/>
  </g>
  <text x="365" y="455" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="19" font-weight="700" fill="#ffffff">Share</text>
  <rect x="268" y="496" width="154" height="9" rx="4.5" fill="#5f718c" fill-opacity="0.35"/>
  <rect x="290" y="514" width="110" height="9" rx="4.5" fill="#5f718c" fill-opacity="0.25"/>

  <!-- connection arrows -->
  <path d="M520 270 C 580 230, 620 230, 680 270" fill="none" stroke="#3fbfaa" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 14" marker-end="url(#arrow)"/>
  <path d="M680 360 C 620 400, 580 400, 520 360" fill="none" stroke="#3fbfaa" stroke-opacity="0.45" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 14"/>

  <!-- RIGHT PHONE: scanning + connected -->
  <g filter="url(#shadow)">
    <rect x="710" y="60" width="290" height="510" rx="44" fill="#0b1020"/>
  </g>
  <rect x="724" y="74" width="262" height="482" rx="34" fill="#1c232e"/>
  <rect x="810" y="86" width="90" height="20" rx="10" fill="#0b1020"/>
  <!-- camera frame -->
  <g stroke="#3fbfaa" stroke-width="7" fill="none" stroke-linecap="round">
    <path d="M760 172 v-30 h30"/><path d="M920 142 h30 v30"/>
    <path d="M760 312 v30 h30"/><path d="M920 342 h30 v-30"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.55">
    <path d="M790 172h36v36h-36z M797 179v22h22v-22z" fill-rule="evenodd"/>
    <path d="M884 172h36v36h-36z M891 179v22h22v-22z" fill-rule="evenodd"/>
    <path d="M790 270h36v36h-36z M797 277v22h22v-22z" fill-rule="evenodd"/>
    <rect x="838" y="174" width="10" height="10"/><rect x="858" y="190" width="10" height="10"/><rect x="838" y="206" width="10" height="10"/>
    <rect x="792" y="222" width="10" height="10"/><rect x="816" y="238" width="10" height="10"/><rect x="842" y="224" width="10" height="10"/>
    <rect x="866" y="244" width="10" height="10"/><rect x="890" y="224" width="10" height="10"/><rect x="910" y="246" width="10" height="10"/>
    <rect x="842" y="272" width="10" height="10"/><rect x="866" y="290" width="10" height="10"/><rect x="892" y="276" width="10" height="10"/>
    <rect x="910" y="296" width="10" height="10"/><rect x="846" y="296" width="10" height="10"/>
  </g>
  <rect x="756" y="238" width="198" height="4" rx="2" fill="#3fbfaa"/>
  <!-- connected card -->
  <rect x="748" y="380" width="214" height="140" rx="18" fill="#ffffff"/>
  <circle cx="784" cy="420" r="20" fill="#148577"/>
  <path d="M775 420 l6 6 l12 -12" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="814" y="417" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="19" font-weight="700" fill="#0b1020">Connected</text>
  <rect x="814" y="427" width="110" height="9" rx="4.5" fill="#5f718c" fill-opacity="0.5"/>
  <g transform="translate(855 488)" fill="none" stroke="#148577" stroke-linecap="round">
    <path d="M-40 0 A57 57 0 0 1 40 0" stroke-width="9" stroke-opacity="0.35"/>
    <path d="M-24 14 A34 34 0 0 1 24 14" stroke-width="9" stroke-opacity="0.65"/>
    <circle cx="0" cy="26" r="7" fill="#148577" stroke="none"/>
  </g>

  <!-- "no typing" chip -->
  <g transform="translate(1025 250)">
    <rect x="0" y="0" width="140" height="64" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
    <g fill="#aeebdd" fill-opacity="0.9">
      <circle cx="30" cy="32" r="6"/><circle cx="50" cy="32" r="6"/><circle cx="70" cy="32" r="6"/><circle cx="90" cy="32" r="6"/><circle cx="110" cy="32" r="6"/>
    </g>
    <path d="M20 52 L120 12" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
