<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t">
  <title id="t">A printed "Scan to chat" QR code next to a phone that opens a chat with a pre-filled message</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#062a27"/>
      <stop offset="0.55" stop-color="#15564f"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <clipPath id="screen"><rect x="664" y="74" width="262" height="482" rx="34"/></clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="420" cy="330" r="250" fill="#3fbfaa" fill-opacity="0.07"/>
  <circle cx="800" cy="310" r="240" fill="#3fbfaa" fill-opacity="0.05"/>

  <!-- QR card: "Scan to chat" -->
  <g filter="url(#shadow)">
    <rect x="210" y="120" width="300" height="400" rx="26" fill="#ffffff"/>
  </g>
  <!-- chat bubble icon -->
  <g transform="translate(360 168)">
    <circle r="30" fill="#d5f5ee"/>
    <path d="M-16 -12 h32 a8 8 0 0 1 8 8 v14 a8 8 0 0 1 -8 8 h-14 l-12 10 v-10 h-6 a8 8 0 0 1 -8 -8 v-14 a8 8 0 0 1 8 -8 z" fill="#148577"/>
    <circle cx="-8" cy="3" r="2.6" fill="#ffffff"/><circle cx="0" cy="3" r="2.6" fill="#ffffff"/><circle cx="8" cy="3" r="2.6" fill="#ffffff"/>
  </g>
  <rect x="250" y="226" width="220" height="220" rx="14" fill="#ffffff" stroke="#e4e8ee"/>
  <g fill="#0b1020">
    <path d="M266 242h52v52h-52z M275 251v34h34v-34z" fill-rule="evenodd"/><rect x="283" y="259" width="18" height="18"/>
    <path d="M402 242h52v52h-52z M411 251v34h34v-34z" fill-rule="evenodd"/><rect x="419" y="259" width="18" height="18"/>
    <path d="M266 378h52v52h-52z M275 387v34h34v-34z" fill-rule="evenodd"/><rect x="283" y="395" width="18" height="18"/>
    <rect x="330" y="242" width="12" height="12"/><rect x="354" y="254" width="12" height="12"/><rect x="376" y="242" width="12" height="12"/>
    <rect x="342" y="276" width="12" height="12"/><rect x="366" y="282" width="12" height="12"/>
    <rect x="266" y="308" width="12" height="12"/><rect x="290" y="320" width="12" height="12"/><rect x="314" y="308" width="12" height="12"/>
    <rect x="338" y="330" width="12" height="12"/><rect x="362" y="308" width="12" height="12"/><rect x="386" y="324" width="12" height="12"/>
    <rect x="410" y="308" width="12" height="12"/><rect x="434" y="330" width="12" height="12"/><rect x="442" y="310" width="12" height="12"/>
    <rect x="280" y="344" width="12" height="12"/><rect x="360" y="348" width="12" height="12"/><rect x="420" y="352" width="12" height="12"/>
    <rect x="330" y="378" width="12" height="12"/><rect x="354" y="396" width="12" height="12"/><rect x="380" y="380" width="12" height="12"/>
    <rect x="404" y="398" width="12" height="12"/><rect x="430" y="382" width="12" height="12"/><rect x="330" y="418" width="12" height="12"/>
    <rect x="384" y="418" width="12" height="12"/><rect x="442" y="418" width="12" height="12"/>
  </g>
  <text x="360" y="488" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" font-weight="800" fill="#0b1020">Scan to chat</text>

  <!-- link arrow -->
  <path d="M530 320 C 575 290, 605 290, 640 315" fill="none" stroke="#3fbfaa" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 14"/>
  <path d="M630 300 l14 17 l-21 6" fill="none" stroke="#3fbfaa" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- phone with chat -->
  <g filter="url(#shadow)">
    <rect x="650" y="60" width="290" height="510" rx="44" fill="#0b1020"/>
  </g>
  <g clip-path="url(#screen)">
    <rect x="664" y="74" width="262" height="482" fill="#eefbf8"/>
    <!-- chat header -->
    <rect x="664" y="74" width="262" height="92" fill="#148577"/>
    <circle cx="704" cy="132" r="20" fill="#d5f5ee"/>
    <path d="M704 124 a7 7 0 1 1 0.01 0 M690 146 a14 10 0 0 1 28 0" fill="#148577"/>
    <rect x="734" y="120" width="110" height="11" rx="5.5" fill="#ffffff"/>
    <rect x="734" y="138" width="70" height="8" rx="4" fill="#ffffff" fill-opacity="0.6"/>
    <!-- incoming bubble -->
    <rect x="680" y="190" width="170" height="54" rx="14" fill="#ffffff"/>
    <rect x="694" y="204" width="130" height="9" rx="4.5" fill="#4a5a73" fill-opacity="0.45"/>
    <rect x="694" y="221" width="90" height="9" rx="4.5" fill="#4a5a73" fill-opacity="0.3"/>
    <!-- pre-filled message in input -->
    <rect x="676" y="474" width="196" height="64" rx="20" fill="#ffffff" stroke="#3fbfaa" stroke-width="2"/>
    <text x="692" y="500" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#0b1020">Hi, I'd like to know</text>
    <text x="692" y="521" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#0b1020">more about your services.</text>
    <circle cx="896" cy="506" r="22" fill="#148577"/>
    <path d="M886 506 l20 -9 l-6 20 l-4 -8 z" fill="#ffffff"/>
    <!-- tag: pre-filled -->
    <rect x="752" y="436" width="112" height="26" rx="13" fill="#0b1020" fill-opacity="0.75"/>
    <text x="808" y="454" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#aeebdd">PRE-FILLED</text>
  </g>
  <rect x="750" y="76" width="90" height="20" rx="10" fill="#0b1020"/>

  <!-- no-need-to-save chip -->
  <g transform="translate(980 220)">
    <rect width="170" height="64" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
    <circle cx="34" cy="32" r="16" fill="#3fbfaa"/>
    <path d="M26 32 l6 6 l10 -11" fill="none" stroke="#062a27" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="62" y="22" width="90" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.55"/>
    <rect x="62" y="38" width="64" height="8" rx="4" fill="#ffffff" fill-opacity="0.3"/>
  </g>
</svg>
